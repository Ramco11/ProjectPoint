<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Point Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <aside class="sidebar">
    <h2>Project Point</h2>

    <nav>
      <a href="#" class="active">Dashboard</a>
      <a href="#">Projects</a>
      <a href="#">Tasks</a>
      <a href="#">Team</a>
      <a href="#">Settings</a>
    </nav>
  </aside>

  <main class="main">

    <header>
      <div>
        <h1>Dashboard</h1>
        <p>Welcome to Project Point</p>
      </div>

      <button id="addProjectBtn">+ Add Project</button>
    </header>

    <section class="stats">

      <div class="stat-card">
        <p>Total Projects</p>
        <h2 id="totalProjects">3</h2>
      </div>

      <div class="stat-card">
        <p>In Progress</p>
        <h2 id="inProgress">2</h2>
      </div>

      <div class="stat-card">
        <p>Completed</p>
        <h2 id="completed">1</h2>
      </div>

      <div class="stat-card">
        <p>Total Points</p>
        <h2 id="totalPoints">270</h2>
      </div>

    </section>

    <section class="projects-section">

      <div class="section-header">
        <h2>My Projects</h2>
        <input
          type="text"
          id="searchInput"
          placeholder="Search projects..."
        >
      </div>

      <div id="projectList" class="project-grid"></div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
