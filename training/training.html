<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FarmSetu | Organic Training</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="training.css">
</head>
<body>

<main class="phone">

  <header class="topbar">
    <a class="back" href="../home/home.html" aria-label="Back to home">‹</a>
    <h1>Organic Training</h1>
  </header>

  <section class="page">

    <div class="learn-banner">
      <div>
        <span class="learn-label">ORGANIC FARMING</span>
        <h2>Grow Better.<br>Farm Naturally.</h2>
        <p>Short practical courses you can follow at your own pace.</p>
      </div>
      <div class="learn-icon">🌱</div>
    </div>

    <div class="stats-row">
      <div><strong id="statCourses">0</strong><span>Courses</span></div>
      <div><strong id="statLessons">0</strong><span>Lessons done</span></div>
      <div><strong id="statComplete">0</strong><span>Completed</span></div>
    </div>

    <input id="courseSearch" class="search" type="search" placeholder="Search courses..." autocomplete="off">

    <div id="levelChips" class="chips">
      <button class="chip active" type="button" data-level="All">All</button>
      <button class="chip" type="button" data-level="Beginner">Beginner</button>
      <button class="chip" type="button" data-level="Intermediate">Intermediate</button>
    </div>

    <div id="courseList" class="course-list"></div>

    <div id="noCourses" class="empty-box" hidden>
      <div class="big">📚</div>
      <h3>No courses found</h3>
      <p>Try a different search or level.</p>
    </div>

  </section>

  <nav class="bottom-nav" aria-label="FarmSetu navigation">
    <a href="../home/home.html"><span>⌂</span>Home</a>
    <a href="../marketplace/marketplace.html"><span>▱</span>Market</a>
    <a class="sell-nav" href="../marketplace/sell.html"><span>＋</span>Sell</a>
    <a class="active" href="training.html"><span>♧</span>Learn</a>
    <a href="../profile/profile.html"><span>♙</span>Profile</a>
  </nav>

</main>

<script src="../js/app.js"></script>
<script src="training.js"></script>
</body>
</html>
