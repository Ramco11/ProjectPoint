<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Organic Farming Training | FarmSetu</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="training.css">
</head>

<body>
    <header class="top-header">
        <a class="brand" href="../index.html">
            <span class="brand-logo">FS</span>

            <span>
                <strong>FarmSetu</strong>
                <small>Organic Farming Academy</small>
            </span>
        </a>

        <a class="training-home" href="../index.html">← Home</a>
    </header>

    <main>
        <section class="training-hero">
            <span class="eyebrow">Learn and grow</span>
            <h1>Organic Farming Academy</h1>

            <p>
                Complete practical lessons and track your learning
                progress on this device.
            </p>

            <div class="progress-card">
                <div>
                    <strong id="completedCount">0 of 6 lessons</strong>
                    <span>completed</span>
                </div>

                <div class="progress-track">
                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>
                </div>
            </div>
        </section>

        <section class="training-section">
            <div class="course-grid" id="courseGrid"></div>
        </section>
    </main>

    <div class="modal" id="lessonModal">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <span class="eyebrow">Training lesson</span>
                    <h2 id="lessonTitle">Lesson</h2>
                </div>

                <button
                    class="close-button"
                    id="closeLessonModal"
                    type="button"
                >
                    ×
                </button>
            </div>

            <div class="lesson-content" id="lessonContent"></div>

            <button
                class="button button-primary full-width"
                id="completeLessonButton"
                type="button"
            >
                Mark as Completed
            </button>
        </div>
    </div>

    <nav class="bottom-navigation">
        <a href="../index.html">
            <span>🏠</span>
            Home
        </a>

        <a href="../marketplace/marketplace.html">
            <span>🛒</span>
            Market
        </a>

        <a href="../equipment/equipment.html">
            <span>🚜</span>
            Equipment
        </a>

        <a class="active" href="training.html">
            <span>🎓</span>
            Learn
        </a>

        <a href="../orders/orders.html">
            <span>📦</span>
            Orders
        </a>
    </nav>

    <script src="training.js"></script>
</body>
</html>
