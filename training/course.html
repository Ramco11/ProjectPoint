<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="../css/global.css">

<body>

<main class="phone">

  <header class="topbar">
    <a class="back" href="training.html" aria-label="Back to courses">‹</a>
    <h1 id="courseHeading">Course</h1>
  </header>

  <section class="page">

    <div class="course-hero">
      <div id="courseIcon" class="course-hero-icon">🌿</div>
      <small id="courseLevel">BEGINNER</small>
      <h2 id="courseTitle">Course title</h2>
      <p id="courseSummary" class="muted"></p>

      <div class="progress big-progress"><span id="courseBar"></span></div>
      <p id="courseProgressText" class="muted">0 of 0 lessons completed</p>
    </div>

    <div class="section-heading"><h2>Lessons</h2></div>

    <div id="lessonList" class="lesson-list"></div>

    <button id="resetCourse" class="btn secondary block" type="button">Reset progress</button>

    <p class="learn-disclaimer">
      Educational information only. Confirm products, quantities and local
      rules with a qualified agricultural officer before treating a crop.
    </p>

  </section>

  <nav class="bottom-nav" aria-label="FarmSetu navigation">

    <a href="../marketplace/marketplace.html"><span>▱</span>Market</a>
