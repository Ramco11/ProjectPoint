<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FarmSetu | Marketplace</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="marketplace.css">
</head>
<body>

<main class="phone">

  <header class="topbar">
    <a class="back" href="../home/home.html" aria-label="Back to home">‹</a>
    <h1>Marketplace</h1>
    <a class="top-action" href="sell.html">+ Sell</a>
  </header>

  <section class="page">

    <input id="marketSearch" class="search" type="search"
           placeholder="Search products, locations or sellers" autocomplete="off">

    <div id="categoryChips" class="chips" aria-label="Categories">
      <button class="chip active" type="button" data-category="All">All</button>
      <button class="chip" type="button" data-category="Vegetables">🥕 Vegetables</button>
      <button class="chip" type="button" data-category="Fruits">🥭 Fruits</button>
      <button class="chip" type="button" data-category="Grains">🌾 Grains</button>
      <button class="chip" type="button" data-category="Seeds">🌱 Seeds</button>
      <button class="chip" type="button" data-category="Pulses">🫘 Pulses</button>
      <button class="chip" type="button" data-category="Spices">🌶️ Spices</button>
      <button class="chip" type="button" data-category="Organic">🌿 Organic</button>
    </div>

    <div class="results-row">
      <strong id="productCount">0 products found</strong>
      <select id="sortSelect" class="sort-select" aria-label="Sort products">
        <option value="new">Newest</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>
    </div>

    <div id="productGrid" class="product-grid"></div>

    <div id="emptyState" class="empty-box" hidden>
      <div class="big">🌱</div>
      <h3>No products found</h3>
      <p>Try another search or list your own product.</p>
      <a class="btn" href="sell.html">Sell a Product</a>
    </div>

  </section>

  <nav class="bottom-nav" aria-label="FarmSetu navigation">
    <a href="../home/home.html"><span>⌂</span>Home</a>
    <a class="active" href="marketplace.html"><span>▱</span>Market</a>
    <a class="sell-nav" href="sell.html"><span>＋</span>Sell</a>
    <a href="../training/training.html"><span>♧</span>Learn</a>
    <a href="../profile/profile.html"><span>♙</span>Profile</a>
  </nav>

</main>

<script src="../js/app.js"></script>
<script src="marketplace.js"></script>
</body>
</html>
