<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contract Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="toast" class="toast"></div>

  <section id="authView" class="auth">
    <form id="authForm" class="auth-card">

      <div class="logo">CA</div>

      <h1>Contract Administration</h1>

      <p>Secure project workspace</p>

      <label>
        Email
        <input
          id="email"
          type="email"
          required
        >
      </label>

      <label>
        Password
        <input
          id="password"
          type="password"
          minlength="8"
          required
        >
      </label>

      <button
        class="primary"
        type="submit"
      >
        Sign in
      </button>

      <button
        class="secondary"
        type="button"
        id="signupBtn"
      >
        Create account
      </button>

      <small id="authMessage"></small>

    </form>
  </section>


  <section
    id="appView"
    class="hidden"
  >

    <aside>

      <div class="brand">
        <span>CA</span>
        <b>Contract Admin</b>
      </div>

      <button
        id="projectBtn"
        class="project-button"
      >
        Select project
      </button>

      <nav id="nav"></nav>

      <div class="account">

        <span id="userEmail"></span>

        <span id="userRole"></span>

        <button id="signoutBtn">
          Sign out
        </button>

      </div>

    </aside>


    <main>

      <header>

        <button id="menuBtn">
          ☰
        </button>

        <select id="projectSelect">
        </select>

        <button
          id="newProjectBtn"
          class="primary"
        >
          + Project
        </button>

        <a
          id="oneDriveBtn"
          class="secondary"
          target="_blank"
          rel="noopener"
        >
          Project files
        </a>

      </header>

      <section id="content"></section>

    </main>

  </section>


  <div
    id="modal"
    class="modal hidden"
  >

    <form
      id="modalForm"
      class="modal-card"
    >

      <div class="modal-head">

        <h2 id="modalTitle"></h2>

        <button
          type="button"
          id="modalClose"
        >
          ×
        </button>

      </div>

      <div id="modalFields"></div>

      <div class="actions">

        <button
          type="button"
          class="secondary"
          id="modalCancel"
        >
          Cancel
        </button>

        <button
          class="primary"
          type="submit"
        >
          Save
        </button>

      </div>

    </form>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="app.js"></script>

</body>
</html>
